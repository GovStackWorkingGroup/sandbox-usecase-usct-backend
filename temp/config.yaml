apiVersion: v1
kind: Namespace
metadata:
  name: temp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: black
  namespace: temp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: black
  template:
    metadata:
      labels:
        app: black
    spec:
      containers:
        - name: black
          image: hashicorp/http-echo
          args:
            - "-text=BLACK - WHITE TEST SITE 1"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: black-service
  namespace: temp
spec:
  type: ClusterIP
  selector:
    app: black
  ports:
    - port: 80        # Service port exposed to Ingress
      targetPort: 5678  # Container port
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: white
  namespace: temp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: white
  template:
    metadata:
      labels:
        app: white
    spec:
      containers:
        - name: white
          image: hashicorp/http-echo
          args:
            - "-text=WHITE SITE"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: white-service
  namespace: temp
spec:
  type: ClusterIP
  selector:
    app: white
  ports:
    - port: 80
      targetPort: 5678
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bw-ingress
  namespace: temp
spec:
  ingressClassName: nginx
  rules:
    - host: black.kube.oleksii.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: black-service
                port:
                  number: 80
    - host: white.kube.oleksii.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: white-service
                port:
                  number: 80